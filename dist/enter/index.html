<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accept the Invitation | Modern Faber</title>
    <meta
      http-equiv="refresh"
      content="0;url=https://join.slack.com/t/modernfaber/shared_invite/zt-3uentlyli-5_PyQMILdRjEEgp3wP7Q4w"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap");

      :root {
        --canvas-top: #efe4d1;
        --canvas-bottom: #cfb190;
        --paper-top: rgba(255, 253, 247, 0.94);
        --paper-bottom: rgba(244, 235, 219, 0.98);
        --ink: #24180f;
        --muted: #6f5741;
        --rule: rgba(98, 73, 48, 0.22);
        --seal-top: #b56737;
        --seal-bottom: #733b1e;
        --shadow: rgba(74, 47, 24, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        font-family: "Cormorant Garamond", Georgia, serif;
        background:
          radial-gradient(circle at top, rgba(255, 249, 239, 0.9), transparent 40%),
          linear-gradient(180deg, var(--canvas-top) 0%, var(--canvas-bottom) 100%);
      }

      main {
        width: min(100%, 560px);
        padding: clamp(28px, 5vw, 48px);
        background: linear-gradient(180deg, var(--paper-top), var(--paper-bottom));
        border: 1px solid rgba(92, 66, 38, 0.18);
        box-shadow:
          0 24px 70px var(--shadow),
          inset 0 1px 0 rgba(255, 255, 255, 0.82);
      }

      p,
      a {
        font-family: "IBM Plex Mono", monospace;
      }

      .eyebrow,
      p {
        color: var(--muted);
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 0.74rem;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.7rem, 9vw, 4.2rem);
        line-height: 0.9;
        font-weight: 600;
        letter-spacing: -0.04em;
      }

      .rule {
        height: 1px;
        margin: 22px 0;
        background: linear-gradient(90deg, transparent, var(--rule) 14%, var(--rule) 86%, transparent);
      }

      p {
        margin: 0;
        font-size: 0.82rem;
        line-height: 1.8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 26px;
        min-width: 176px;
        min-height: 54px;
        padding: 14px 22px;
        border: 1px solid rgba(122, 74, 38, 0.35);
        border-radius: 999px;
        background: radial-gradient(circle at 30% 30%, var(--seal-top), var(--seal-bottom));
        box-shadow: 0 14px 32px rgba(91, 41, 16, 0.22);
        color: #fff9f2;
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Modern Faber</p>
      <h1>Opening the letter</h1>
      <div class="rule" aria-hidden="true"></div>
      <p>
        If the invitation does not open automatically, use the link below and step into the room.
      </p>
      <a
        href="https://join.slack.com/t/modernfaber/shared_invite/zt-3uentlyli-5_PyQMILdRjEEgp3wP7Q4w"
        target="_blank"
        rel="noreferrer"
      >
        Accept the invitation
      </a>
    </main>
  </body>
</html>
